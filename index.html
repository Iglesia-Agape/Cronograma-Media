<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cronograma de Producción — Ágape Media</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap');

        :root {
            --bg-main:        #080c14;
            --bg-card:        #0e1625;
            --bg-elevated:    #162033;
            --text-main:      #e8f0ff;
            --text-muted:     #5a7090;
            --text-sub:       #8ba8c8;
            --accent:         #4f9eff;
            --accent-glow:    rgba(79,158,255,0.12);
            --border:         #1c2d45;
            --border-bright:  #243650;

            --c-previo:          #9333ea;  --c-previo-bg:       rgba(147,51,234,0.12);
            --c-transmision:     #ef4444;  --c-transmision-bg:  rgba(239,68,68,0.12);
            --c-alabanza:        #3b82f6;  --c-alabanza-bg:     rgba(59,130,246,0.12);
            --c-mensaje:         #f97316;  --c-mensaje-bg:      rgba(249,115,22,0.12);
            --c-ministracion:    #10b981;  --c-ministracion-bg: rgba(16,185,129,0.12);
            --c-cierre:          #64748b;  --c-cierre-bg:       rgba(100,116,139,0.12);
            --c-staff:           #a78bfa;
            --c-aviso:           #fbbf24;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg-main);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
        }

        body::before {
            content: '';
            position: fixed; inset: 0;
            background-image:
                linear-gradient(rgba(79,158,255,0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(79,158,255,0.025) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none; z-index: 0;
        }

        .page-wrap { position: relative; z-index: 1; padding: 24px 28px; max-width: 1400px; margin: 0 auto; }

        /* ── HEADER ── */
        header {
            display: flex; justify-content: space-between; align-items: flex-start;
            padding-bottom: 24px; border-bottom: 1px solid var(--border); margin-bottom: 28px;
            gap: 16px; flex-wrap: wrap;
        }
        .header-left h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }
        .header-left .subtitle { margin-top: 4px; font-size: 13px; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; }
        .header-right { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

        .live-badge {
            display: flex; align-items: center; gap: 7px;
            background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3);
            color: #f87171; padding: 7px 14px; border-radius: 6px;
            font-size: 12px; font-weight: 700; letter-spacing: 1px;
        }
        .live-dot { width: 7px; height: 7px; background: #ef4444; border-radius: 50%; animation: pulse-red 1.4s ease-in-out infinite; }
        @keyframes pulse-red { 0%,100%{opacity:.4;transform:scale(.9)} 50%{opacity:1;transform:scale(1.1)} }

        .clock-badge {
            display: flex; align-items: center;
            background: var(--bg-card); border: 1px solid var(--border-bright);
            color: var(--accent); padding: 7px 14px; border-radius: 6px;
            font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 700;
        }
        .sync-badge {
            display: flex; align-items: center; gap: 7px;
            background: var(--bg-card); border: 1px solid var(--border-bright);
            color: var(--text-muted); padding: 7px 14px; border-radius: 6px; font-size: 12px;
        }
        .sync-icon.spinning { animation: spin 1s linear infinite; display:inline-block; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── ACTIVE BANNER ── */
        #active-banner {
            display: none; margin-bottom: 20px; padding: 14px 20px;
            border-radius: 10px; border: 1px solid rgba(79,158,255,0.2);
            border-left: 4px solid var(--accent); background: var(--accent-glow);
            animation: fadeIn .4s ease;
        }
        @keyframes fadeIn { from{opacity:0;transform:translateY(-6px)} to{opacity:1;transform:translateY(0)} }
        #active-banner .banner-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; color: var(--accent); margin-bottom: 6px; }
        #active-banner .banner-content { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
        #active-banner .banner-title { font-size: 16px; font-weight: 700; }
        #active-banner .banner-block { font-size: 12px; color: var(--text-muted); }
        .progress-bar-wrap { margin-top: 10px; background: rgba(255,255,255,0.06); border-radius: 4px; height: 4px; overflow: hidden; }
        .progress-bar-fill { height: 100%; background: var(--accent); border-radius: 4px; transition: width 1s linear; }

        /* ── TABS ── */
        .tabs { display: flex; gap: 8px; margin-bottom: 24px; flex-wrap: wrap; }
        .tab-btn {
            background: var(--bg-card); color: var(--text-muted); border: 1px solid var(--border);
            padding: 10px 22px; border-radius: 8px; font-weight: 600; font-size: 13px;
            cursor: pointer; transition: all .2s; font-family: 'Inter', sans-serif;
        }
        .tab-btn:hover { border-color: var(--border-bright); color: var(--text-sub); }
        .tab-btn.active { background: var(--accent-glow); color: var(--accent); border-color: rgba(79,158,255,0.4); }

        /* ── TOOLBAR ── */
        .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 10px; }
        .toolbar-left { display: flex; gap: 8px; }
        .view-btn {
            background: var(--bg-card); border: 1px solid var(--border); color: var(--text-muted);
            padding: 7px 14px; border-radius: 6px; font-size: 12px; font-weight: 600;
            cursor: pointer; font-family: 'Inter', sans-serif; transition: all .2s;
        }
        .view-btn.active { background: var(--bg-elevated); color: var(--text-main); border-color: var(--border-bright); }
        .stats-row { display: flex; gap: 8px; flex-wrap: wrap; }
        .stat-chip { background: var(--bg-card); border: 1px solid var(--border); border-radius: 6px; padding: 5px 12px; font-size: 12px; color: var(--text-muted); }
        .stat-chip span { color: var(--text-main); font-weight: 700; }

        /* ── TABLE VIEW ── */
        .table-wrap { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; margin-bottom: 24px; }
        table { width: 100%; border-collapse: collapse; }
        thead th {
            background: rgba(8,12,20,0.8); padding: 13px 16px;
            font-size: 11px; text-transform: uppercase; letter-spacing: 1px;
            color: var(--text-muted); border-bottom: 1px solid var(--border); font-weight: 600;
        }
        tbody td { padding: 13px 16px; border-bottom: 1px solid var(--border); font-size: 14px; vertical-align: middle; }
        tbody tr:last-child td { border-bottom: none; }
        tbody tr { transition: background .15s; }
        tbody tr:hover { background: rgba(255,255,255,0.015); }
        tbody tr.row-active { background: var(--accent-glow) !important; }

        .time-cell { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; color: var(--accent); white-space: nowrap; }
        .duration-chip { background: rgba(255,255,255,0.06); border: 1px solid var(--border); padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: 700; font-family: 'JetBrains Mono', monospace; color: var(--text-sub); }
        .bloque-pill { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 20px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .8px; white-space: nowrap; }
        .bloque-dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
        .actividad-cell { font-weight: 600; color: var(--text-main); }
        .desc-cell { color: var(--text-muted); font-size: 13px; white-space: pre-line; line-height: 1.5; }

        /* ── AVISO BADGE ── */
        .aviso-badge {
            display: inline-flex; align-items: center; gap: 5px;
            background: rgba(251,191,36,0.1); border: 1px solid rgba(251,191,36,0.3);
            color: var(--c-aviso); padding: 3px 10px; border-radius: 4px;
            font-size: 11px; font-weight: 700; white-space: nowrap;
        }

        /* ── STAFF ── */
        .staff-section-header td { background: rgba(167,139,250,0.05) !important; border-top: 2px solid rgba(167,139,250,0.2) !important; }
        .staff-section-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; color: var(--c-staff); }
        .staff-name-cell { font-weight: 600; color: var(--c-staff); }

        /* ── CARD VIEW ── */
        #card-view { display: none; margin-bottom: 24px; }
        .timeline { display: grid; gap: 3px; }
        .card {
            display: grid; grid-template-columns: 110px 1fr auto;
            border-radius: 8px; overflow: hidden; border: 1px solid var(--border);
            transition: border-color .2s, transform .2s;
            animation: slideIn .3s ease both;
        }
        .card:hover { border-color: var(--border-bright); transform: translateX(2px); }
        .card.card-active { border-color: var(--accent) !important; }
        @keyframes slideIn { from{opacity:0;transform:translateX(-8px)} to{opacity:1;transform:translateX(0)} }

        .card-time { background: var(--bg-card); padding: 14px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; border-right: 1px solid var(--border); gap: 3px; }
        .card-time-start { font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 700; color: var(--accent); }
        .card-time-dur { font-size: 10px; color: var(--text-muted); font-weight: 600; }
        .card-time-end { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-muted); }

        .card-body { padding: 12px 16px; display: flex; flex-direction: column; justify-content: center; gap: 5px; }
        .card-header-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .card-actividad { font-size: 14px; font-weight: 700; color: var(--text-main); }
        .card-desc { font-size: 12px; color: var(--text-muted); line-height: 1.5; }

        .card-aviso {
            display: flex; align-items: center; padding: 0 14px;
            border-left: 1px solid var(--border);
            background: rgba(251,191,36,0.04);
        }

        /* Staff cards */
        .staff-section-title { margin-top: 28px; margin-bottom: 12px; font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--text-muted); font-weight: 700; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
        .staff-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
        .staff-card { background: var(--bg-card); border: 1px solid var(--border-bright); border-radius: 10px; padding: 14px; border-left: 3px solid var(--c-staff); animation: slideIn .3s ease both; }
        .staff-card-area { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--c-staff); margin-bottom: 4px; }
        .staff-card-name { font-size: 15px; font-weight: 700; color: var(--text-main); }
        .staff-card-notes { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

        /* ── CONSOLE ── */
        .console-wrap { margin-top: 8px; }
        .console-label { font-size: 11px; color: var(--text-muted); margin-bottom: 6px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; }
        #debug-log { background: rgba(0,0,0,0.5); border: 1px solid var(--border); color: #4ade80; font-family: 'JetBrains Mono', monospace; padding: 12px 14px; border-radius: 8px; font-size: 11px; max-height: 120px; overflow-y: auto; line-height: 1.6; }

        .state-cell { text-align: center; padding: 60px 20px !important; }
        .state-icon { font-size: 36px; margin-bottom: 10px; }
        .state-msg { color: var(--text-muted); font-size: 14px; }

        /* bloque pills */
        .pill-previo       { color:#9333ea; background:rgba(147,51,234,.12); }
        .pill-transmision  { color:#ef4444; background:rgba(239,68,68,.12); }
        .pill-alabanza     { color:#3b82f6; background:rgba(59,130,246,.12); }
        .pill-mensaje      { color:#f97316; background:rgba(249,115,22,.12); }
        .pill-ministracion { color:#10b981; background:rgba(16,185,129,.12); }
        .pill-cierre       { color:#64748b; background:rgba(100,116,139,.12); }

        .card-previo       { background:rgba(147,51,234,.04); }
        .card-transmision  { background:rgba(239,68,68,.04); }
        .card-alabanza     { background:rgba(59,130,246,.04); }
        .card-mensaje      { background:rgba(249,115,22,.04); }
        .card-ministracion { background:rgba(16,185,129,.04); }
        .card-cierre       { background:rgba(100,116,139,.04); }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-main); }
        ::-webkit-scrollbar-thumb { background: var(--border-bright); border-radius: 3px; }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .header-logo {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid var(--border-bright);
            filter: invert(1) brightness(0.85);
            flex-shrink: 0;
        }

        @media(max-width:700px){
            .page-wrap{padding:16px;}
            header{flex-direction:column;}
            .card{grid-template-columns:80px 1fr;}
            .card-aviso{display:none;}
            .header-logo{width:40px;height:40px;}
        }

        /* ── AJUSTES ── */
        .table-wrap { overflow-x: auto; }
        table { min-width: 820px; }
        .card-desc { white-space: pre-line; }
        .card-aviso-mobile { display: none; margin-top: 4px; font-size: 11px; font-weight: 700; color: var(--c-aviso); }
        .console-wrap { display: none; }
        body.debug .console-wrap { display: block; }
        @media(max-width:700px){ .card-aviso-mobile { display: block; } }

        /* ── MEJORAS v2 ── */
        :root { --c-mine: #2dd4bf; }
        .mi-select {
            background: var(--bg-card); border: 1px solid var(--border); color: var(--text-sub);
            padding: 7px 10px; border-radius: 6px; font-size: 12px; font-weight: 600;
            font-family: 'Inter', sans-serif; max-width: 190px; cursor: pointer;
        }
        .mi-select.set { border-color: rgba(45,212,191,.5); color: var(--c-mine); }
        .toolbar-left { flex-wrap: wrap; }
        .mine-badge {
            display: inline-block; margin-left: 8px; padding: 2px 8px; border-radius: 4px;
            background: rgba(45,212,191,.12); border: 1px solid rgba(45,212,191,.35);
            color: var(--c-mine); font-size: 10px; font-weight: 700; letter-spacing: .5px; white-space: nowrap;
        }
        tr.row-mine td:first-child { box-shadow: inset 3px 0 0 var(--c-mine); }
        .card.card-mine { border-color: rgba(45,212,191,.45); }
        tr.staff-mine td, .staff-card.staff-mine { background: rgba(45,212,191,.07); }
        .staff-card.staff-mine { border-color: rgba(45,212,191,.5); border-left-color: var(--c-mine); }
        .banner-right { text-align: right; }
        .banner-countdown { font-family: 'JetBrains Mono', monospace; font-size: 26px; font-weight: 800; color: var(--accent); line-height: 1; }
        .banner-cd-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); margin: 2px 0 6px; }
        .banner-next { margin-top: 10px; font-size: 12px; color: var(--text-sub); }
    </style>
</head>
<body>
<div class="page-wrap">

    <header>
        <div class="header-left">
            <div class="header-brand">
                <img src="Logo-media.jpeg" alt="Ágape Media" class="header-logo" onerror="this.style.display='none'">
                <div>
                    <h1>CRONOGRAMA MEDIA</h1>
                    <div class="subtitle">ágape.media / control de producción</div>
                </div>
            </div>
        </div>
        <div class="header-right">
            <div class="live-badge"><div class="live-dot"></div>EN VIVO</div>
            <div class="clock-badge" id="live-clock">--:--:--</div>
            <div class="sync-badge"><span class="sync-icon" id="sync-icon">⟳</span><span id="sync-label">Iniciando…</span></div>
        </div>
    </header>

    <div id="active-banner">
        <div class="banner-label" id="banner-label">▶ AHORA</div>
        <div class="banner-content">
            <div>
                <div class="banner-title" id="banner-title">—</div>
                <div class="banner-block" id="banner-block">—</div>
            </div>
            <div class="banner-right">
                <div class="banner-countdown" id="banner-countdown"></div>
                <div class="banner-cd-label" id="banner-cd-label">restante</div>
                <div id="banner-time" style="font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--text-muted);"></div>
            </div>
        </div>
        <div class="progress-bar-wrap"><div class="progress-bar-fill" id="banner-progress" style="width:0%"></div></div>
        <div class="banner-next" id="banner-next"></div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="cambiarPestaña(0, this)">Ágape · Primera</button>
        <button class="tab-btn" onclick="cambiarPestaña(1, this)">Ágape · Segunda</button>
        <button class="tab-btn" onclick="cambiarPestaña(2, this)">Explosión</button>
    </div>

    <div class="toolbar">
        <div class="toolbar-left">
            <button class="view-btn active" id="btn-table" onclick="setView('table')">☰ Tabla</button>
            <button class="view-btn" id="btn-card" onclick="setView('card')">◫ Línea de tiempo</button>
            <select class="mi-select" id="mi-nombre" onchange="elegirNombre(this.value)" title="Resalta tus actividades"><option value="">👤 Mi nombre…</option></select>
        </div>
        <div class="stats-row" id="stats-row"></div>
    </div>

    <div id="table-view">
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th style="width:13%">Hora inicio</th>
                        <th style="width:8%">Duración</th>
                        <th style="width:10%">Hora fin</th>
                        <th style="width:17%">Bloque</th>
                        <th style="width:20%">Actividad</th>
                        <th style="width:16%">Descripción / Notas</th>
                        <th style="width:16%">⚠ Avisos</th>
                    </tr>
                </thead>
                <tbody id="cronograma-body">
                    <tr><td colspan="7" class="state-cell"><div class="state-icon">⟳</div><div class="state-msg">Cargando flujo de datos…</div></td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <div id="card-view">
        <div class="timeline" id="card-timeline"></div>
        <div id="staff-card-section"></div>
    </div>

    <div class="console-wrap">
        <div class="console-label">Consola del sistema</div>
        <div id="debug-log">Iniciando secuenciador de pautas…</div>
    </div>

</div>

<script>
    /* ── CONFIG ── */
    const SHEET_ID_PUBLICADO = "2PACX-1vTHX3umAF4N-HNU7qVBBj7TF6mHZTz9VIzNoAnyd1-kRL6J1Ig1zAdNnmMg9sb9dI7nS9N9XEc82wGb";
    const SHEET_ID_DIRECTO   = "13GqRrgWTb4inoj1o_HSwPacbHDBCBtkeJ9f5Zx6bN7U";
    const GIDS     = ["1584889573", "124546572", "378460028"];
    const HASHES   = ["primera", "segunda", "explosion"];   /* link directo: ...#segunda */
    const POLL_INTERVAL = 30000;
    const DEBUG = new URLSearchParams(location.search).has("debug");   /* ...?debug muestra la consola */

    let pestañaActiva = Math.max(0, HASHES.indexOf(location.hash.slice(1)));
    let vistaActual   = window.innerWidth <= 700 ? "card" : "table";
    let datos = { actividades: [], staff: [] };
    const cache   = {};   /* índice de pestaña → { datos, ts } */
    const errores = {};   /* índice de pestaña → mensaje */
    let cargando = false;

    if (DEBUG) document.body.classList.add("debug");

    /* ── ALMACENAMIENTO LOCAL (funciona sin internet / modo privado) ── */
    function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
    function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
    const LS_PREFIX = "cronograma:csv:";
    const LS_NOMBRE = "cronograma:minombre";
    const fmtHora = ts => new Date(ts).toLocaleTimeString("es-HN", { hour: "2-digit", minute: "2-digit" });
    const hashInicial = HASHES.includes(location.hash.slice(1));   /* si traen #segunda, se respeta */
    let usuarioEligio = false, autoHecho = false;
    let miNombre = lsGet(LS_NOMBRE) || "";
    let misAreas = [];   /* áreas de esta persona en la pestaña activa */
    let mias = [];       /* por actividad: área que coincide ("" si no) */

    /* ── UTILIDADES ── */
    function esc(s) {
        return String(s ?? "").replace(/[&<>"']/g, ch => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[ch]));
    }
    function tickClock() {
        document.getElementById("live-clock").textContent =
            new Date().toLocaleTimeString("es-HN", { hour:"2-digit", minute:"2-digit", second:"2-digit" });
    }
    setInterval(tickClock, 1000); tickClock();

    function log(msg, tipo = "ok") {
        if (!DEBUG) return;
        const box = document.getElementById("debug-log");
        const c = { ok:"#4ade80", error:"#f87171", warn:"#fbbf24", info:"#60a5fa" }[tipo] || "#4ade80";
        box.innerHTML += `<br><span style="color:${c}">[${new Date().toLocaleTimeString("es-HN")}] ${esc(msg)}</span>`;
        box.scrollTop = box.scrollHeight;
    }
    function setSync(estado, texto) {
        document.getElementById("sync-icon").classList.toggle("spinning", estado === "loading");
        document.getElementById("sync-label").textContent = texto;
    }

    /* ── FETCH ──
       Orden: gviz (más fresco) → /pub (publicado) → un proxy como último recurso.
       Cada intento tiene timeout corto para que una falla no bloquee todo. */
    function esCSVValido(t) { return t && t.length > 20 && !t.trimStart().startsWith("<"); }

    async function intentarFetch(url, timeoutMs = 6000) {
        const res = await fetch(url, { signal: AbortSignal.timeout(timeoutMs), cache: "no-store" });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const texto = await res.text();
        if (!esCSVValido(texto)) throw new Error("la respuesta no es CSV");
        return texto;
    }

    /* Cada hoja trae un título "CRONOGRAMA GENERAL - ÁGAPE (PRIMERA REUNIÓN)", etc.
       Con esto verificamos que la respuesta sea de la pestaña que pedimos. */
    const TITULOS = ["PRIMERA", "SEGUNDA", "EXPLOSI"];
    function tituloDe(csv) {
        const m = csv.match(/CRONOGRAMA GENERAL[^,"\r\n]*/i);
        return m ? m[0].trim() : "";
    }

    async function fetchCSV(gid, idx) {
        const cb = Date.now();
        const urlPub = `https://docs.google.com/spreadsheets/d/e/${SHEET_ID_PUBLICADO}/pub?output=csv&gid=${gid}&single=true&cb=${cb}`;
        const intentos = [
            ["gviz", `https://docs.google.com/spreadsheets/d/${SHEET_ID_DIRECTO}/gviz/tq?tqx=out:csv&headers=0&gid=${gid}&cb=${cb}`],
            ["pub",  urlPub],
            ["proxy", `https://api.allorigins.win/raw?url=${encodeURIComponent(urlPub)}`],
        ];
        let hubo_pestana_equivocada = false;
        for (const [nombre, url] of intentos) {
            try {
                const texto = await intentarFetch(url);
                const t = tituloDe(texto);
                if (t && !t.toUpperCase().includes(TITULOS[idx])) {
                    hubo_pestana_equivocada = true;
                    throw new Error(`devolvió otra pestaña ("${t}")`);
                }
                log(`gid ${gid}: OK vía ${nombre} — "${t || "sin título"}"`, "ok");
                return texto;
            } catch (e) {
                log(`gid ${gid}: ${nombre} falló (${e.message})`, "warn");
            }
        }
        if (hubo_pestana_equivocada)
            throw new Error("Google está devolviendo otra pestaña. Comparte la hoja como \"Cualquier persona con el enlace: Lector\" y vuelve a publicar el documento completo.");
        throw new Error("No se pudo leer la hoja. Verifica que esté compartida como \"Cualquier persona con el enlace\" y publicada en la web.");
    }

    /* Carga las 3 pestañas en paralelo y guarda cada CSV en el teléfono. */
    async function actualizarTodo() {
        if (cargando) return;
        cargando = true;
        setSync("loading", "Actualizando…");
        await Promise.all(GIDS.map(async (gid, i) => {
            try {
                if (navigator.onLine === false) throw new Error("Sin conexión a internet.");
                const csv = await fetchCSV(gid, i);
                const ts = Date.now();
                cache[i] = { datos: parsearCSV(csv), ts };
                lsSet(LS_PREFIX + i, JSON.stringify({ csv, ts }));
                delete errores[i];
            } catch (e) {
                errores[i] = e.message;
                log(`Pestaña ${i}: ${e.message}`, "error");
            }
        }));
        cargando = false;
        actualizarSelectorNombre();
        elegirPestañaAuto();
        renderizar();
        const fallos = Object.keys(errores).length;
        if (fallos === 0)                 setSync("ok", `Sincronizado ${fmtHora(Date.now())}`);
        else if (fallos < GIDS.length)    setSync("ok", `Parcial · ${fmtHora(Date.now())}`);
        else {
            const t = cache[pestañaActiva]?.ts;
            setSync("ok", t ? `Sin conexión · datos de ${fmtHora(t)}` : "Error de sync");
        }
    }

    function cargarDesdeAlmacenamiento() {
        GIDS.forEach((_, i) => {
            const raw = lsGet(LS_PREFIX + i);
            if (!raw) return;
            try { const { csv, ts } = JSON.parse(raw); cache[i] = { datos: parsearCSV(csv), ts }; } catch (e) {}
        });
    }

    /* ── CSV ── */
    /* Parser real: respeta comillas, comas y SALTOS DE LÍNEA dentro de una celda
       (p. ej. la lista de anuncios en una sola celda). */
    function parseCSVRows(text) {
        const rows = []; let row = [], cell = "", q = false;
        for (let i = 0; i < text.length; i++) {
            const ch = text[i];
            if (q) {
                if (ch === '"') { if (text[i+1] === '"') { cell += '"'; i++; } else q = false; }
                else cell += ch;
            } else if (ch === '"') q = true;
            else if (ch === ",") { row.push(cell); cell = ""; }
            else if (ch === "\n" || ch === "\r") {
                if (ch === "\r" && text[i+1] === "\n") i++;
                row.push(cell); cell = ""; rows.push(row); row = [];
            } else cell += ch;
        }
        if (cell !== "" || row.length) { row.push(cell); rows.push(row); }
        return rows;
    }
    const limpiar = s => (s || "").replace(/\r/g, "").trim();
    /* Todo lo que empiece con // se ignora (notas para quienes editan la hoja). */
    const quitarNotas = s => s.split("\n").filter(l => !l.trim().startsWith("//")).join("\n").trim();

    function parsearCSV(texto) {
        const filas = parseCSVRows(texto);
        const actividades = [], staff = [];
        let bloqueActual = "PRODUCCIÓN";
        let modoStaff = false, grupoStaff = "";
        let avisosPendientes = [];

        /* Columna donde empieza la tabla = donde aparece "HORA INICIO" */
        let offset = 0;
        for (const f of filas) {
            const k = f.findIndex(x => limpiar(x).toUpperCase() === "HORA INICIO");
            if (k >= 0) { offset = k; break; }
        }

        /* filas limpias (sin columnas decorativas ni filas vacías), para poder mirar la fila siguiente */
        const limpias = [];
        for (const filaOriginal of filas) {
            const fila = filaOriginal.map(x => quitarNotas(limpiar(x)));
            let lead = 0;
            while (lead < offset && lead < fila.length && !fila[lead]) lead++;
            const fc = fila.slice(lead);
            if (fc.some(Boolean)) limpias.push(fc);
        }
        const esEncabezadoArea = f => !!f && ["ÁREA", "AREA", "ÁREAS"].includes((f[0] || "").toUpperCase());

        for (let k = 0; k < limpias.length; k++) {
            const c = limpias[k];

            const c0U = c[0].toUpperCase();
            if (c0U.includes("CRONOGRAMA GENERAL")) continue;
            if (c0U === "HORA INICIO" || c0U === "HORA") continue;

            /* ── ENCARGADOS ── */
            if (c0U === "ÁREA" || c0U === "AREA" || c0U === "ÁREAS" || (c[1] || "").toUpperCase() === "ENCARGADOS") {
                modoStaff = true;
                continue;
            }
            if (modoStaff) {
                const area = c[0], prev = staff.length ? staff[staff.length-1] : null;
                let encargado = c[1] || "";
                const sinNotas = !c.slice(2).some(Boolean);
                /* Fila con solo texto en ÁREA: si lo que sigue es un encabezado "ÁREA | ENCARGADOS",
                   es un subtítulo de grupo (p. ej. TRANSMISIÓN DE PRUEBA). Si no, es un área cuyo
                   encargado está en una celda combinada con la fila de arriba. */
                if (area && !encargado && sinNotas) {
                    if (esEncabezadoArea(limpias[k+1])) { grupoStaff = area; continue; }
                    if (prev) encargado = prev.encargado;
                }
                if (encargado) {
                    const areaFinal = area || (prev ? prev.area : "");
                    staff.push({ grupo: grupoStaff, area: areaFinal, encargado, notas: c.slice(2).filter(Boolean).join(" · ") });
                }
                continue;
            }

            const avisoRaw = c[6] || c[5] || "";

            /* ── FILA DE BLOQUE (solo la primera celda tiene texto) ── */
            if (c[0] && c.slice(1).every(x => !x)) {
                if (avisoRaw) avisosPendientes.push(avisoRaw);
                bloqueActual = c[0];
                continue;
            }

            const [horaInicio = "", duracion = "", horaFinal = "", actividad = "", descripcion = ""] = c;
            if (!actividad) {
                if (avisoRaw) avisosPendientes.push(avisoRaw);
                continue;
            }

            /* celdas combinadas: heredar la hora de la actividad anterior */
            const prev = actividades[actividades.length - 1];
            if (avisoRaw) avisosPendientes.push(avisoRaw);
            actividades.push({
                horaInicio: horaInicio || (prev ? prev.horaInicio : ""),
                duracion:   duracion   || (prev ? prev.duracion   : ""),
                horaFinal:  horaFinal  || (prev ? prev.horaFinal  : ""),
                bloque: bloqueActual, actividad, descripcion,
                aviso: [...new Set(avisosPendientes)].join(" · "),
            });
            avisosPendientes = [];
        }
        return { actividades, staff };
    }

    /* ── HELPERS ── */
    function clasePill(bloque) {
        const b = bloque.toUpperCase();
        if (b.includes("PREVIO"))                                                   return "pill-previo";
        if (b.includes("TRANSMIS") || b.includes("INICIO") || b.includes("TIMER"))  return "pill-transmision";
        if (b.includes("ALABANZA") || b.includes("ADORAC"))                         return "pill-alabanza";
        if (b.includes("MENSAJE") || b.includes("BIENVENIDA") || b.includes("PALABRA") || b.includes("PREDICAC")) return "pill-mensaje";
        if (b.includes("MINISTR") || b.includes("ALTAR"))                           return "pill-ministracion";
        return "pill-cierre";
    }
    const claseCard = b => clasePill(b).replace("pill-", "card-");

    function parseTime(t) {
        if (!t) return null;
        const m = t.match(/(\d{1,2})[:\.](\d{2})\s*(a\.?\s?m\.?|p\.?\s?m\.?)?/i);
        if (!m) return null;
        let h = parseInt(m[1]), min = parseInt(m[2]);
        if (m[3]) {
            const ap = m[3].toLowerCase().replace(/[\.\s]/g, "");
            if (ap === "pm" && h !== 12) h += 12;
            if (ap === "am" && h === 12) h = 0;
        }
        return h * 60 + min;
    }

    /* ── PERSONAS / "MI NOMBRE" ── */
    const norm = s => String(s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase().replace(/[^A-Z0-9]+/g, " ").trim();
    const SEP_PERSONAS = /\s+(?:I|Y)\s+|\s*[,\/+&]\s*/i;     /* "JOSUÉ I YEYSON" → 2 personas */
    const personasDe = enc => String(enc || "").split(SEP_PERSONAS).map(p => p.trim()).filter(Boolean);

    function mismaPersona(candidato, nombre) {
        const a = norm(candidato), b = norm(nombre);
        if (!a || !b) return false;
        if (a === b) return true;
        const sa = a.split(" "), sb = b.split(" ");
        return (sa.length === 1 && sb[0] === sa[0]) || (sb.length === 1 && sa[0] === sb[0]);   /* "YEYSON" ↔ "YEYSON SÁNCHEZ" */
    }
    const esMiEncargado = enc => !!miNombre && personasDe(enc).some(p => mismaPersona(p, miNombre));

    const STOP = new Set(["DE", "LA", "LAS", "LOS", "EL", "I", "Y", "PRO", "GENERAL", "MOVIMIENTO", "PRUEBA", "STREAMING"]);
    function clavesDeArea(area) {
        const claves = new Set();
        String(area || "").split(/[|\/]|\s+I\s+|\s+Y\s+/i).forEach(parte => {
            const n = norm(parte);
            if (!n) return;
            claves.add(n.replace(/ /g, ""));                      /* "PRO PRESENTER" → "PROPRESENTER" */
            n.split(" ").forEach(w => { if (w.length >= 3 && !STOP.has(w)) claves.add(w); });
        });
        return claves;
    }
    /* ¿Esta actividad menciona alguna de mis áreas? (coincidencia por palabras) */
    function coincide(a) {
        if (!miNombre) return "";
        const texto = " " + norm(a.actividad + " " + a.descripcion) + " ";
        if (texto.includes(" EQUIPO COMPLETO ") || texto.includes(" TODOS ")) return "EQUIPO";
        if (!misAreas.length) return "";
        const tokens = new Set(texto.trim().split(" "));
        for (const area of misAreas) for (const k of clavesDeArea(area)) if (tokens.has(k)) return area;
        return "";
    }
    function calcularMias() {
        misAreas = miNombre ? datos.staff.filter(s => esMiEncargado(s.encargado)).map(s => s.area) : [];
        mias = datos.actividades.map(coincide);
    }
    function actualizarSelectorNombre() {
        const sel = document.getElementById("mi-nombre");
        if (!sel) return;
        const lista = new Map();
        Object.values(cache).forEach(e => e.datos.staff.forEach(s => personasDe(s.encargado).forEach(p => {
            const k = norm(p); if (k && !lista.has(k)) lista.set(k, p);
        })));
        let nombres = [...lista.values()];
        /* quitar nombres de pila sueltos si ya existe el nombre completo */
        nombres = nombres.filter(n => { const k = norm(n); return k.includes(" ") || !nombres.some(o => o !== n && norm(o).startsWith(k + " ")); });
        if (miNombre && !nombres.some(n => norm(n) === norm(miNombre))) nombres.push(miNombre);
        nombres.sort((a, b) => a.localeCompare(b, "es"));
        sel.innerHTML = `<option value="">👤 Mi nombre…</option>` +
            nombres.map(n => `<option value="${esc(n)}"${norm(n) === norm(miNombre) ? " selected" : ""}>${esc(n)}</option>`).join("");
        sel.classList.toggle("set", !!miNombre);
    }
    function elegirNombre(v) {
        miNombre = v || "";
        lsSet(LS_NOMBRE, miNombre);
        document.getElementById("mi-nombre").classList.toggle("set", !!miNombre);
        renderizar();
    }

    /* ── BANNER: AHORA + SIGUE + CUENTA REGRESIVA ── */
    const fmtCuenta = seg => { seg = Math.max(0, Math.round(seg)); return Math.floor(seg / 60) + ":" + String(seg % 60).padStart(2, "0"); };
    const fmtEn = seg => seg < 90 ? `${Math.max(1, Math.round(seg))} s` : `${Math.ceil(seg / 60)} min`;

    function rangosDeActividades() {
        return datos.actividades.map(a => {
            const s = parseTime(a.horaInicio); let e = parseTime(a.horaFinal);
            if (s === null || e === null) return null;
            if (e < s) e += 720;   /* tolera errores de a.m./p.m. en la hoja */
            return { s: s * 60, e: e * 60 };
        });
    }

    function actualizarBannerActivo() {
        const banner = document.getElementById("active-banner");
        const $ = id => document.getElementById(id);
        document.querySelectorAll(".row-active").forEach(r => r.classList.remove("row-active"));
        document.querySelectorAll(".card-active").forEach(r => r.classList.remove("card-active"));
        const { actividades } = datos;
        if (!actividades.length) { banner.style.display = "none"; return; }

        const now = new Date();
        const nowSec = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
        const rangos = rangosDeActividades();
        const activos = [];
        let sigS = Infinity;
        rangos.forEach((r, i) => {
            if (!r) return;
            if (nowSec >= r.s && nowSec < r.e) activos.push(i);
            else if (r.s > nowSec && r.s < sigS) sigS = r.s;
        });
        const sig = [];
        if (sigS !== Infinity) rangos.forEach((r, i) => { if (r && r.s === sigS) sig.push(i); });
        const tuya = idxs => idxs.some(i => mias[i]);

        if (activos.length) {
            const a = actividades[activos[0]], r = rangos[activos[0]];
            $("banner-label").textContent = "▶ AHORA" + (tuya(activos) ? " · ★ TU ÁREA" : "");
            $("banner-title").textContent = a.actividad;
            $("banner-block").textContent = a.bloque + (activos.length > 1 ? ` · ${activos.length} actividades a la vez` : "");
            $("banner-time").textContent  = `${a.horaInicio} – ${a.horaFinal}`;
            $("banner-countdown").textContent = fmtCuenta(r.e - nowSec);
            $("banner-cd-label").textContent  = "restante";
            $("banner-progress").style.width  = Math.min(100, ((nowSec - r.s) / (r.e - r.s)) * 100) + "%";
            if (sig.length) {
                const n = actividades[sig[0]];
                $("banner-next").textContent = `Sigue: ${n.actividad}${sig.length > 1 ? ` (+${sig.length - 1})` : ""} · ${n.horaInicio} · en ${fmtEn(sigS - nowSec)}${tuya(sig) ? " ★" : ""}`;
                $("banner-next").style.display = "";
            } else $("banner-next").style.display = "none";
            activos.forEach(i => {
                document.getElementById(`row-${i}`)?.classList.add("row-active");
                document.getElementById(`card-${i}`)?.classList.add("card-active");
            });
            banner.style.display = "block";
        } else if (sig.length && sigS - nowSec <= 1800) {
            const n = actividades[sig[0]];
            $("banner-label").textContent = "⏭ SIGUE" + (tuya(sig) ? " · ★ TU ÁREA" : "");
            $("banner-title").textContent = n.actividad;
            $("banner-block").textContent = n.bloque;
            $("banner-time").textContent  = `${n.horaInicio} – ${n.horaFinal}`;
            $("banner-countdown").textContent = fmtCuenta(sigS - nowSec);
            $("banner-cd-label").textContent  = "para iniciar";
            $("banner-progress").style.width  = "0%";
            $("banner-next").style.display = "none";
            banner.style.display = "block";
        } else {
            banner.style.display = "none";
        }
    }

    /* ── STATS ── */
    function renderStats() {
        const { actividades, staff } = datos;
        const bloques = new Set(actividades.map(a => a.bloque)).size;
        const conAviso = actividades.filter(a => a.aviso).length;
        let mi = "";
        if (miNombre) {
            mi = misAreas.length
                ? `<div class="stat-chip" style="border-color:rgba(45,212,191,.4);color:var(--c-mine)">★ ${esc(misAreas.join(" · "))}</div>`
                : `<div class="stat-chip" style="color:var(--text-muted)">Sin área tuya en esta reunión</div>`;
        }
        document.getElementById("stats-row").innerHTML =
            `${mi}<div class="stat-chip"><span>${actividades.length}</span> actividades</div>
             <div class="stat-chip"><span>${bloques}</span> bloques</div>
             <div class="stat-chip"><span>${staff.length}</span> encargados</div>
             ${conAviso ? `<div class="stat-chip" style="border-color:rgba(251,191,36,.3);color:var(--c-aviso)"><span>${conAviso}</span> avisos</div>` : ""}`;
    }

    /* ── RENDER TABLA ── */
    function renderTable() {
        const { actividades, staff } = datos;
        let html = "";
        if (!actividades.length) {
            html = `<tr><td colspan="7" class="state-cell"><div class="state-icon">📭</div><div class="state-msg">No se encontraron datos.<br><small style="font-size:11px;">Agrega <b>?debug</b> al final del link para ver la consola.</small></div></td></tr>`;
        }
        actividades.forEach((a, i) => {
            const mia = mias[i] ? `<span class="mine-badge">★ ${esc(mias[i])}</span>` : "";
            html += `
            <tr id="row-${i}" class="${mias[i] ? "row-mine" : ""}">
                <td class="time-cell">${esc(a.horaInicio)}</td>
                <td><span class="duration-chip">${esc(a.duracion) || "—"}</span></td>
                <td class="time-cell" style="color:var(--text-sub)">${esc(a.horaFinal)}</td>
                <td><span class="bloque-pill ${clasePill(a.bloque)}"><span class="bloque-dot"></span>${esc(a.bloque)}</span></td>
                <td class="actividad-cell">${esc(a.actividad)}${mia}</td>
                <td class="desc-cell">${esc(a.descripcion)}</td>
                <td>${a.aviso ? `<span class="aviso-badge">⚠ ${esc(a.aviso)}</span>` : `<span style="color:var(--border)">—</span>`}</td>
            </tr>`;
        });
        if (staff.length) {
            html += `<tr class="staff-section-header"><td colspan="7"><span class="staff-section-label">▸ EQUIPO TÉCNICO / ENCARGADOS</span></td></tr>`;
            let g = "";
            for (const s of staff) {
                if (s.grupo !== g) {
                    g = s.grupo;
                    if (g) html += `<tr class="staff-section-header"><td colspan="7"><span class="staff-section-label">${esc(g)}</span></td></tr>`;
                }
                html += `
                <tr class="${esMiEncargado(s.encargado) ? "staff-mine" : ""}">
                    <td colspan="3" style="color:var(--text-muted);font-size:11px;font-family:'JetBrains Mono',monospace;">STAFF</td>
                    <td style="font-weight:700;color:var(--text-main)">${esc(s.area)}</td>
                    <td class="staff-name-cell">${esc(s.encargado)}</td>
                    <td class="desc-cell" colspan="2">${esc(s.notas)}</td>
                </tr>`;
            }
        }
        document.getElementById("cronograma-body").innerHTML = html;
    }

    /* ── RENDER TARJETAS ── */
    function renderCards() {
        const { actividades, staff } = datos;
        let html = actividades.length ? "" : `<div style="text-align:center;padding:60px 20px;color:var(--text-muted)">No hay datos para mostrar.</div>`;
        actividades.forEach((a, i) => {
            const avisoCol = a.aviso
                ? `<div class="card-aviso"><span class="aviso-badge" style="flex-direction:column;gap:2px;padding:6px 10px;text-align:center">
                        <span style="font-size:14px">⚠</span>
                        <span style="font-size:10px;white-space:normal;max-width:100px;line-height:1.3">${esc(a.aviso)}</span>
                   </span></div>` : "";
            html += `
            <div class="card ${claseCard(a.bloque)}${mias[i] ? " card-mine" : ""}" id="card-${i}">
                <div class="card-time">
                    <div class="card-time-start">${esc(a.horaInicio) || "—"}</div>
                    <div class="card-time-dur">${esc(a.duracion)}</div>
                    ${a.horaFinal ? `<div class="card-time-end">${esc(a.horaFinal)}</div>` : ""}
                </div>
                <div class="card-body">
                    <div class="card-header-row"><span class="bloque-pill ${clasePill(a.bloque)}"><span class="bloque-dot"></span>${esc(a.bloque)}</span>${mias[i] ? `<span class="mine-badge" style="margin-left:0">★ ${esc(mias[i])}</span>` : ""}</div>
                    <div class="card-actividad">${esc(a.actividad)}</div>
                    ${a.descripcion ? `<div class="card-desc">${esc(a.descripcion)}</div>` : ""}
                    ${a.aviso ? `<div class="card-aviso-mobile">⚠ ${esc(a.aviso)}</div>` : ""}
                </div>
                ${avisoCol}
            </div>`;
        });
        document.getElementById("card-timeline").innerHTML = html;

        let staffHtml = "";
        if (staff.length) {
            let g = null;
            for (const s of staff) {
                if (g === null || s.grupo !== g) {
                    if (g !== null) staffHtml += `</div>`;
                    g = s.grupo;
                    staffHtml += `<div class="staff-section-title">▸ ${esc(g || "EQUIPO TÉCNICO / ENCARGADOS")}</div><div class="staff-grid">`;
                }
                staffHtml += `
                <div class="staff-card${esMiEncargado(s.encargado) ? " staff-mine" : ""}">
                    <div class="staff-card-area">${esc(s.area)}</div>
                    <div class="staff-card-name">${esc(s.encargado)}</div>
                    ${s.notas ? `<div class="staff-card-notes">${esc(s.notas)}</div>` : ""}
                </div>`;
            }
            staffHtml += `</div>`;
        }
        document.getElementById("staff-card-section").innerHTML = staffHtml;
    }

    /* ── RENDER PRINCIPAL (siempre de la pestaña activa, desde el caché) ── */
    function renderizar() {
        const entrada = cache[pestañaActiva];
        if (!entrada) {
            const msg = errores[pestañaActiva]
                ? `<div class="state-icon">⚠️</div><div class="state-msg" style="color:#f87171;max-width:500px;margin:0 auto;">${esc(errores[pestañaActiva])}</div>`
                : `<div class="state-icon">⟳</div><div class="state-msg">Cargando…</div>`;
            document.getElementById("cronograma-body").innerHTML = `<tr><td colspan="7" class="state-cell">${msg}</td></tr>`;
            document.getElementById("card-timeline").innerHTML = `<div class="state-cell" style="text-align:center;padding:60px 20px;">${msg}</div>`;
            document.getElementById("staff-card-section").innerHTML = "";
            document.getElementById("stats-row").innerHTML = "";
            document.getElementById("active-banner").style.display = "none";
            return;
        }
        datos = entrada.datos;
        calcularMias();
        renderStats(); renderTable(); renderCards(); actualizarBannerActivo();
    }

    /* ── VISTA ── */
    function setView(v) {
        vistaActual = v;
        document.getElementById("table-view").style.display = v === "table" ? "block" : "none";
        document.getElementById("card-view").style.display  = v === "card"  ? "block" : "none";
        document.getElementById("btn-table").classList.toggle("active", v === "table");
        document.getElementById("btn-card").classList.toggle("active",  v === "card");
    }

    /* ── TABS ── */
    function marcarTab() {
        document.querySelectorAll(".tab-btn").forEach((b, i) => b.classList.toggle("active", i === pestañaActiva));
    }
    function cambiarPestaña(index) {
        usuarioEligio = true; autoHecho = true;
        pestañaActiva = index;
        history.replaceState(null, "", "#" + HASHES[index]);
        marcarTab();
        renderizar();   /* instantáneo si ya está en caché */
    }

    /* Domingos: abre sola la reunión que está en curso (o la próxima).
       No actúa si el link trae #segunda, #explosion…, ni si ya elegiste una pestaña.
       Para probarlo otro día: agrega ?auto al link. */
    function rangoDeTab(i) {
        const e = cache[i];
        if (!e || !e.datos.actividades.length) return null;
        let s = Infinity, f = -Infinity;
        for (const a of e.datos.actividades) {
            const x = parseTime(a.horaInicio); let y = parseTime(a.horaFinal);
            if (x === null || y === null) continue;
            if (y < x) y += 720;
            s = Math.min(s, x); f = Math.max(f, y);
        }
        return s === Infinity ? null : { s, f };
    }
    function elegirPestañaAuto() {
        if (autoHecho) return;
        if (hashInicial || usuarioEligio) { autoHecho = true; return; }
        const ahoraD = new Date();
        if (ahoraD.getDay() !== 0 && !new URLSearchParams(location.search).has("auto")) { autoHecho = true; return; }
        const rangos = GIDS.map((_, i) => rangoDeTab(i));
        if (rangos.some(r => !r)) return;   /* espera a tener las 3 pestañas */
        autoHecho = true;
        const ahora = ahoraD.getHours() * 60 + ahoraD.getMinutes();
        let mejor = -1, mejorS = -1;
        rangos.forEach((r, i) => { if (ahora >= r.s - 15 && ahora <= r.f + 5 && r.s > mejorS) { mejor = i; mejorS = r.s; } });
        if (mejor < 0) {
            let pS = Infinity;
            rangos.forEach((r, i) => { if (r.s > ahora && r.s < pS) { mejor = i; pS = r.s; } });
            if (mejor < 0) mejor = 0;
        }
        if (mejor !== pestañaActiva) { pestañaActiva = mejor; marcarTab(); renderizar(); }
    }

    /* ── INIT ── */
    window.onload = () => {
        marcarTab();
        setView(vistaActual);
        cargarDesdeAlmacenamiento();      /* muestra al instante lo último que se vio */
        actualizarSelectorNombre();
        elegirPestañaAuto();
        renderizar();
        const t = cache[pestañaActiva]?.ts;
        if (t) setSync("ok", `Datos guardados · ${fmtHora(t)}`);
        actualizarTodo();
        setInterval(actualizarTodo, POLL_INTERVAL);
        setInterval(actualizarBannerActivo, 1000);   /* cuenta regresiva */
        document.addEventListener("visibilitychange", () => { if (!document.hidden) actualizarTodo(); });
        window.addEventListener("online", actualizarTodo);
        if ("serviceWorker" in navigator && location.protocol === "https:") {
            navigator.serviceWorker.register("sw.js").catch(() => {});   /* permite abrir la página sin internet */
        }
    };

</script>
